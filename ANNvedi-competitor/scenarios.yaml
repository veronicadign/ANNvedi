# ANNvedi self-calibrating contestant — SEEDED for the known dataset names.
# Per-dataset blocks carry pre-calibrated knobs (r for gpu, ef for hnsw) at
# recall >= bar + 1.5%, so fit() SKIPS the calibration pass entirely (faster
# build). Unknown stems hit 'default' (no seeds) and self-calibrate at fit.
# hnsw ef seeds come from experiments/results/tuning_20260811_210929.json,
# re-selected at the raised +1.5% target.
scenarios:
  high_recall:
    default:
      index_params:
        backend: gpu
      query_params: {}
    yahoo-minilm-public: &id001
      index_params:
        backend: gpu
        M: 16
        ef_construction: 100
        mode: sq8
        r: 150
        ef: 140
      query_params:
        r: 150
        ef: 140
    yahoo-minilm-private: *id001
