# Hybrid contestant: the index selects the backend at fit() time.
# backend gpu -> quantized GPU filter + CPU exact rerank (r candidates);
#   falls back to the hnsw params in the SAME block when no CUDA device.
# backend hnsw -> tuned CPU HNSW directly.
# Assignments measured on the g7e (2026-08-19): gpu everywhere for
# high_recall (sweeps Marie Kondo + Paperone; wins/ties Sherlock on 4/7)
# and memory (leanest host RSS); gpu only where faster for fast.
scenarios:
  high_recall:
    default:
      index_params:
        backend: gpu
        M: 16
        ef_construction: 100
        mode: sq8
        heuristic: true
        reorder: true
      query_params:
        r: 150
        ef: 120
    yahoo-minilm-public: &id001
